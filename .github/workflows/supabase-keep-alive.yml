# Backup keep-alive if Vercel Cron misses a day.
# Read-only SELECT against Supabase — does not insert/update/delete data.
name: Supabase keep-alive

on:
  schedule:
    # Daily at 12:00 UTC (~09:00 Brasília)
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only ping (profiles select limit 1)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing GitHub secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi
          # GET only — no Prefer: return=representation writes
          code=$(curl -sS -o /tmp/keep-alive-body.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")
          echo "HTTP $code"
          head -c 200 /tmp/keep-alive-body.txt || true
          echo
          # 200 = success (often []). 401/403/5xx = fail.
          test "$code" = "200"
